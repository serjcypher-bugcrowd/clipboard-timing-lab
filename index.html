<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Clipboard read timing lab</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
 body{font:15px/1.5 -apple-system,system-ui,sans-serif;margin:0;padding:16px;
      background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#111)}
 h1{font-size:17px;margin:0 0 4px} p{margin:6px 0;color:var(--tg-theme-hint-color,#707579)}
 button{font:600 15px/1 inherit;padding:12px 16px;border:0;border-radius:10px;width:100%;
        background:var(--tg-theme-button-color,#2ea6ff);color:var(--tg-theme-button-text-color,#fff)}
 table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px}
 th,td{text-align:left;padding:5px 6px;border-bottom:1px solid rgba(128,128,128,.25)}
 td.v{font-family:ui-monospace,Menlo,monospace;word-break:break-all}
 .sum{margin-top:14px;padding:10px;border-radius:10px;
      background:var(--tg-theme-secondary-bg-color,#f1f1f4);font-weight:600}
</style>

<h1>Clipboard read timing lab</h1>
<p>Measures how many <code>readTextFromClipboard</code> calls return data after
<strong>one</strong> tap of the button, over a 10&nbsp;second window.</p>
<p>Copy some different text while the window runs, to see which values a single tap reaches.</p>

<button id="go">Run (tap once)</button>
<div class="sum" id="sum">Not started.</div>
<table id="t"><thead><tr><th>#</th><th>t+ms</th><th>data</th></tr></thead><tbody></tbody></table>

<script>
const WebApp = window.Telegram?.WebApp;
WebApp?.ready();
WebApp?.expand();

const INTERVAL_MS = 400;     // one call per 400 ms
const WINDOW_MS   = 10000;   // the documented interaction window
let running = false;

function row(n, dt, data){
  const tb = document.querySelector('#t tbody');
  const tr = document.createElement('tr');
  const shown = (data === null || data === undefined)
    ? '<em>null — no access</em>'
    : (data === '' ? '<em>(empty clipboard)</em>' : String(data).slice(0,120));
  tr.innerHTML = '<td>'+n+'</td><td>'+dt+'</td><td class="v">'+shown+'</td>';
  tb.appendChild(tr);
}

document.getElementById('go').addEventListener('click', () => {
  if (running) return;
  if (!WebApp?.readTextFromClipboard) {
    document.getElementById('sum').textContent =
      'readTextFromClipboard is not available in this client.';
    return;
  }
  running = true;
  document.querySelector('#t tbody').innerHTML = '';

  const started = performance.now();
  let calls = 0, withData = 0;
  const distinct = new Set();

  // Every call below happens WITHOUT any further user interaction — the button was
  // tapped once, and nothing else is touched for the rest of the window.
  const timer = setInterval(() => {
    const dt = Math.round(performance.now() - started);
    if (dt > WINDOW_MS) {
      clearInterval(timer);
      running = false;
      document.getElementById('sum').textContent =
        calls + ' calls after one tap · ' + withData + ' returned data · '
        + distinct.size + ' distinct value(s)';
      return;
    }
    calls++;
    const n = calls;
    WebApp.readTextFromClipboard((data) => {
      if (data !== null && data !== undefined) { withData++; distinct.add(data); }
      row(n, dt, data);
      document.getElementById('sum').textContent =
        calls + ' calls after one tap · ' + withData + ' returned data · '
        + distinct.size + ' distinct value(s)';
    });
  }, INTERVAL_MS);
});
</script>
